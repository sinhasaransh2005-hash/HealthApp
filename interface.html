<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-layout">

    <!-- Left Side Images -->
    <div class="side-images">
        <img src="https://cdn-icons-png.flaticon.com/512/2966/2966486.png">
        <img src="https://cdn-icons-png.flaticon.com/512/1048/1048941.png">
        <img src="https://cdn-icons-png.flaticon.com/512/2784/2784461.png">
        <img src="https://cdn-icons-png.flaticon.com/512/2936/2936886.png">
    </div>

    <!-- Main Content -->
    <div class="container">

        <header>
            <h2>Good Morning</h2>
            <p>Stay healthy today</p>
        </header>

        <div class="search-box">
            <input type="text" placeholder="Search doctors, medicines...">
        </div>

        <div class="health-score card">
            <h3>Health Score</h3>
            <div class="score">86/100</div>

            <div class="progress">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="appointment card">
            <h3>Upcoming Appointment</h3>
            <p>Cardiologist</p>
            <span>Tomorrow, 11:30 AM</span>
        </div>

        <h3 class="section-title">Quick Actions</h3>

        <div class="actions">
            <button>Book</button>
            <button>Reports</button>
            <button>Medicines</button>
            <button>Emergency</button>
        </div>

        <h3 class="section-title">Today's Stats</h3>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>❤️ Heart Rate</h4>
                <p>72 BPM</p>
            </div>

            <div class="stat-card">
                <h4>👣 Steps</h4>
                <p>8,540</p>
            </div>

            <div class="stat-card">
                <h4>💧 Water</h4>
                <p>2.1 L</p>
            </div>

            <div class="stat-card">
                <h4>🌙 Sleep</h4>
                <p>7.5 hrs</p>
            </div>
        </div>

    </div>

    <!-- Right Side Images -->
    <div class="side-images">
        <img src="https://cdn-icons-png.flaticon.com/512/4320/4320371.png">
        <img src="https://cdn-icons-png.flaticon.com/512/2785/2785819.png">
        <img src="https://cdn-icons-png.flaticon.com/512/4320/4320337.png">
        <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png">
    </div>

</div>

<nav class="bottom-nav">
    <a href="#">Home</a>
    <a href="#">Appointments</a>
    <a href="#">Health</a>
    <a href="#">Pharmacy</a>
    <a href="#">Profile</a>
</nav>

</body>
</html>
