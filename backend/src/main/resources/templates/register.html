<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HealthTrack</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 10px;
        }

        .register-container {
            max-width: 480px;
            width: 100%;
        }

        .register-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
            background: none;
            border-bottom: none;
            padding: 0;
        }

        .card-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 10px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-weight: 500;
            font-size: 14px;
            color: #334155;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-control, .form-select {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            font-size: 15px;
            background: #fafbfd;
            transition: var(--transition);
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: white;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: var(--transition);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-toggle a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .field-error {
            font-size: 12px;
            color: #dc2626;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-card">
        <a th:href="@{/login(role=${role})}" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Login</a>
        
        <div class="card-header" style="margin-top: 15px;">
            <div style="font-size: 32px; color: var(--primary);"><i class="fa-solid fa-heart-pulse"></i></div>
            <h2 th:text="${role == 'doctor' ? 'Doctor Registration' : 'Patient Registration'}">Patient Sign Up</h2>
            <p>Create a premium companion account.</p>
        </div>

        <form th:action="@{/register(role=${role})}" th:object="${user}" method="POST" id="signup-form">
            <!-- Hidden inputs -->
            <input type="hidden" th:field="*{role}">

            <div class="form-group">
                <label class="form-label" for="fullname"><i class="fa-solid fa-signature"></i> Full Name</label>
                <input type="text" class="form-control" id="fullname" th:field="*{fullname}" placeholder="John Doe" required>
                <span class="field-error" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></span>
            </div>

            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label" for="username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="johndoe" required>
                    <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label" for="gmail"><i class="fa-solid fa-envelope"></i> Gmail Address</label>
                    <input type="email" class="form-control" id="gmail" th:field="*{gmail}" placeholder="johndoe@gmail.com" required>
                    <span class="field-error" th:if="${#fields.hasErrors('gmail')}" th:errors="*{gmail}"></span>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="••••••••" required>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label" for="confirmPassword"><i class="fa-solid fa-check-double"></i> Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" placeholder="••••••••" required>
                    <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label" for="gender"><i class="fa-solid fa-venus-mars"></i> Gender</label>
                    <select class="form-select" id="gender" th:field="*{gender}" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label" for="age"><i class="fa-solid fa-birthday-cake"></i> Age</label>
                    <input type="number" class="form-control" id="age" th:field="*{age}" placeholder="30" required min="1" max="120">
                    <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
                <input type="tel" class="form-control" id="phone" th:field="*{phone}" placeholder="+1 555-0199" required>
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="address"><i class="fa-solid fa-house-chimney"></i> Address</label>
                <input type="text" class="form-control" id="address" th:field="*{address}" placeholder="123 Health Ave, Wellness City" required>
                <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <div class="auth-toggle">
            Already have an account? <a th:href="@{/login(role=${role})}">Login</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
