<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Premium Healthcare Companion</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7; /* Sky blue */
            --primary-dark: #0369a1;
            --primary-light: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing-container {
            max-width: 480px;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .brand-logo i {
            color: var(--primary-light);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
        }

        .portal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 24px;
            text-decoration: none;
            display: block;
        }

        .portal-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(2, 132, 199, 0.08);
            border-color: var(--primary-light);
        }

        .portal-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px auto;
            transition: var(--transition);
        }

        .portal-card.patient .portal-icon {
            background: rgba(2, 132, 199, 0.08);
            color: var(--primary);
        }

        .portal-card.doctor .portal-icon {
            background: rgba(99, 102, 241, 0.08);
            color: #6366f1;
        }

        .portal-card:hover .portal-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .portal-card h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .portal-card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 0;
        }

        .portal-card.doctor:hover {
            border-color: #818cf8;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="landing-container">
    <div class="brand-header">
        <div class="brand-logo">
            <i class="fa-solid fa-heart-pulse"></i> HealthTrack
        </div>
        <div class="brand-subtitle">Your Premium Healthcare Portal</div>
    </div>

    <a th:href="@{/login(role='patient')}" class="portal-card patient">
        <div class="portal-icon">
            <i class="fa-solid fa-user-injured"></i>
        </div>
        <h3>Patient Portal</h3>
        <p>Book appointments, edit metrics, and access medical summaries securely.</p>
    </a>

    <a th:href="@{/login(role='doctor')}" class="portal-card doctor">
        <div class="portal-icon">
            <i class="fa-solid fa-user-md"></i>
        </div>
        <h3>Doctor Portal</h3>
        <p>Manage appointments, patient lists, clinical requests, and prescriptions.</p>
    </a>

    <footer>
        &copy; 2026 HealthTrack Inc. All rights reserved.
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
