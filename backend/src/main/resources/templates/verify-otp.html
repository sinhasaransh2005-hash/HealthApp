<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - HealthTrack</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-container {
            max-width: 440px;
            width: 100%;
            padding: 24px;
        }

        .otp-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
            position: relative;
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
            background: none;
            border-bottom: none;
            padding: 0;
        }

        .card-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 10px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 500;
            font-size: 14px;
            color: #334155;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-control {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            background: #fafbfd;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
            background: white;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: var(--transition);
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="otp-container">
    <div class="otp-card">
        
        <div class="card-header">
            <div style="font-size: 32px; color: var(--primary);"><i class="fa-solid fa-envelope-open-text"></i></div>
            <h2>Verify OTP Code</h2>
            <p>An OTP code has been generated and sent (check the Java IDE backend console output). Enter it below.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger p-3 mb-4 rounded-3 text-center" style="font-size: 14px; border: 1px solid #fca5a5;">
            <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/verify-otp}" method="POST">
            <div class="form-group">
                <label class="form-label" for="otp"><i class="fa-solid fa-lock-open"></i> One-Time Password (OTP)</label>
                <input type="text" class="form-control" id="otp" name="otp" required maxlength="6" autocomplete="off" placeholder="000000">
            </div>

            <button type="submit" class="submit-btn">Verify Code</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
