<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Center - HealthTrack</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="container">

        <!-- Header -->
        <div class="subpage-header">
            <h3 style="color: var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> Emergency Center</h3>
            <a href="interface.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <!-- Flashing red SOS button -->
        <div class="sos-container card">
            <div class="sos-button-wrapper">
                <button class="sos-circle-btn" id="sos-trigger-btn">
                    <span>SOS</span>
                </button>
                <div class="sos-pulse-wave"></div>
            </div>
            <p class="sos-instructions">Tap the button to call medical emergency services immediately.</p>
        </div>

        <!-- Emergency hotlines -->
        <h3 class="section-title">Emergency Hotlines</h3>
        <div class="emergency-links">
            <div class="emergency-link-item card" data-target="Ambulance (911)">
                <i class="fa-solid fa-truck-medical icon-red"></i>
                <div>
                    <h5>Ambulance</h5>
                    <span>Tap to dial 911</span>
                </div>
            </div>
            <div class="emergency-link-item card" data-target="Cardiac Response Unit">
                <i class="fa-solid fa-heart-pulse icon-red"></i>
                <div>
                    <h5>Cardiology Emergency</h5>
                    <span>Tap to call cardiac response unit</span>
                </div>
            </div>
            <div class="emergency-link-item card" data-target="Poison Control Centre">
                <i class="fa-solid fa-skull icon-red"></i>
                <div>
                    <h5>Poison Control</h5>
                    <span>Tap to dial 1-800-222-1222</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Generated by shared.js -->
    </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Navigation highlights
    initNavbar('home'); // Associated with home sub-actions

    const sosTriggerBtn = document.getElementById('sos-trigger-btn');
    
    sosTriggerBtn.addEventListener('click', () => {
        // Simple click scale down/up effect
        sosTriggerBtn.style.transform = 'scale(0.92)';
        setTimeout(() => { sosTriggerBtn.style.transform = 'scale(1)'; }, 150);

        // Simulation alert
        alert('🚨 SOS EMERGENCY SYSTEM ACTIVATED!\n\nSimulating connection with emergency response services...\n\nYour profile details (O Positive blood type, patient J. Doe, emergency contact spouse Jane Doe) and current GPS location have been forwarded to local dispatchers.');
    });

    // Hotline triggers
    document.querySelectorAll('.emergency-link-item').forEach(item => {
        item.addEventListener('click', () => {
            const service = item.getAttribute('data-target');
            alert(`📞 Calling ${service}...\n\nSimulating emergency contact dispatch call. Connecting now.`);
        });
    });
});
</script>
</body>
</html>
