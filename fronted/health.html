<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Hydration Log - HealthTrack</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="container">

        <!-- Header -->
        <div class="subpage-header">
            <h3><i class="fa-solid fa-shield-halved icon-teal"></i> Health & Water Log</h3>
            <a href="interface.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <!-- Water Tracker Widget Card -->
        <div class="card water-tracker-card">
            <div class="water-header">
                <h4>Daily Hydration</h4>
                <span class="water-progress-text" id="water-progress-text">-- / 3.0 Liters</span>
            </div>
            <div class="water-visual">
                <div class="water-fill-bar">
                    <div class="water-fill" id="water-fill-bar" style="width: 0%;"></div>
                </div>
            </div>
            <div class="water-actions">
                <button class="water-btn" id="water-decrease"><i class="fa-solid fa-minus"></i> 250ml</button>
                <button class="water-btn plus" id="water-increase"><i class="fa-solid fa-plus"></i> 250ml</button>
            </div>
        </div>

        <!-- Health Tip Card -->
        <div class="card tips-card">
            <div class="card-header">
                <h4><i class="fa-solid fa-lightbulb icon-teal"></i> Health Tip of the Day</h4>
            </div>
            <p id="tip-text">Drinking a glass of water first thing in the morning helps rehydrate your body, jumpstart digestion, and boost brain function.</p>
        </div>

        <!-- Goals Progress Card -->
        <div class="card stats-analysis-card">
            <h4 style="font-family: var(--font-heading); font-size: 16px; margin-bottom: 16px;">Goal Achievements</h4>
            
            <div class="goal-item">
                <div class="goal-info">
                    <span>Steps Goal (10,000 steps)</span>
                    <strong id="goal-steps-text">--%</strong>
                </div>
                <div class="goal-progress">
                    <div class="goal-progress-fill" id="goal-steps-bar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="goal-item" style="margin-top: 18px;">
                <div class="goal-info">
                    <span>Sleep Goal (8.0 hours)</span>
                    <strong id="goal-sleep-text">--%</strong>
                </div>
                <div class="goal-progress">
                    <div class="goal-progress-fill" id="goal-sleep-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Generated by shared.js -->
    </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    // Navigation highlights
    initNavbar('health');

    const waterProgressText = document.getElementById('water-progress-text');
    const waterFillBar = document.getElementById('water-fill-bar');
    const stepsText = document.getElementById('goal-steps-text');
    const stepsBar = document.getElementById('goal-steps-bar');
    const sleepText = document.getElementById('goal-sleep-text');
    const sleepBar = document.getElementById('goal-sleep-bar');

    const waterDecrease = document.getElementById('water-decrease');
    const waterIncrease = document.getElementById('water-increase');

    const TIPS = [
        "Drinking a glass of water first thing in the morning helps rehydrate your body, jumpstart digestion, and boost brain function.",
        "Take a 5-minute stretch break for every hour you sit at a desk to keep joints flexible and relieve tension.",
        "Eating dynamic foods rich in fiber helps support digestion and keeps energy levels stable throughout the day.",
        "Prioritize 7-8 hours of sleep. Consistent sleep cycles boost immune systems and support mental focus.",
        "A brisk 15-minute walk post-lunch helps lower insulin peaks and supports cardiovascular health."
    ];

    // Select dynamic health tip based on day of month
    document.getElementById('tip-text').innerText = TIPS[new Date().getDate() % TIPS.length];

    let cachedData = null;

    async function loadStats() {
        cachedData = await getDashboardData();
        
        // Hydration level
        const waterLiters = cachedData.water || 0.0;
        waterProgressText.textContent = `${waterLiters.toFixed(2)} / 3.0 Liters`;
        waterFillBar.style.width = `${Math.min(100, (waterLiters / 3.0) * 100)}%`;

        // Steps ratio (Goal 10,000 steps)
        const stepsVal = cachedData.steps || 0;
        const stepsPercent = Math.round(Math.min(100, (stepsVal / 10000) * 100));
        stepsText.textContent = `${stepsPercent}%`;
        stepsBar.style.width = `${stepsPercent}%`;

        // Sleep ratio (Goal 8 hours)
        const sleepVal = cachedData.sleep || 0.0;
        const sleepPercent = Math.round(Math.min(100, (sleepVal / 8.0) * 100));
        sleepText.textContent = `${sleepPercent}%`;
        sleepBar.style.width = `${sleepPercent}%`;
    }

    await loadStats();

    // Water level controllers
    waterDecrease.addEventListener('click', () => adjustWater(-0.25));
    waterIncrease.addEventListener('click', () => adjustWater(0.25));

    async function adjustWater(amount) {
        if (!cachedData) return;
        const currentVal = cachedData.water || 0.0;
        const newVal = Math.max(0.0, Math.min(10.0, currentVal + amount));
        
        cachedData.water = newVal;

        // Optimistic UI update
        waterProgressText.textContent = `${newVal.toFixed(2)} / 3.0 Liters`;
        waterFillBar.style.width = `${Math.min(100, (newVal / 3.0) * 100)}%`;

        // Send changes to localStorage & backend
        await saveDashboardData(cachedData);
        await loadStats();
    }
});
</script>
</body>
</html>
