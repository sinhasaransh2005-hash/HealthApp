<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pill Organizer & Store - HealthTrack</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="container">

        <!-- Header -->
        <div class="subpage-header">
            <h3><i class="fa-solid fa-prescription-bottle-medical icon-teal"></i> Pill Organizer</h3>
            <a href="interface.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <!-- Pill Organizer Checklist Card -->
        <div class="card med-list-card">
            <div class="med-list-header">
                <h4>Daily Medicines</h4>
                <button class="add-med-toggle-btn" id="toggle-add-med"><i class="fa-solid fa-plus"></i> Add Pill</button>
            </div>

            <!-- Add new medicine form (toggled) -->
            <form id="add-medicine-form" style="display: none; margin-bottom: 20px; padding: 16px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-base);">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="new-med-name">Medicine Name</label>
                    <input type="text" id="new-med-name" placeholder="e.g. Metformin" required>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="new-med-dose">Dosage</label>
                    <input type="text" id="new-med-dose" placeholder="e.g. 1 Tablet (500mg)" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="new-med-time">Frequency / Time</label>
                    <input type="text" id="new-med-time" placeholder="e.g. Morning & Night" required>
                </div>
                <button type="submit" class="submit-btn" style="padding: 10px; font-size: 14px; margin-top: 0;">Add Medicine</button>
            </form>

            <!-- Pill organizer items list -->
            <div class="medicines-list" id="medicines-list-container">
                <!-- Dynamic Pill Items -->
            </div>
        </div>

        <!-- Order Medicines Store section -->
        <h3 class="section-title">Order Medicines</h3>
        <div class="store-grid">
            <div class="store-item card">
                <i class="fa-solid fa-droplet icon-teal"></i>
                <h5>Multi-Vitamins</h5>
                <span>60 capsules • $12.50</span>
                <button class="buy-now-btn" data-item="Multi-Vitamins">Order</button>
            </div>
            <div class="store-item card">
                <i class="fa-solid fa-face-smile icon-teal"></i>
                <h5>Pain Reliever</h5>
                <span>20 tablets • $6.90</span>
                <button class="buy-now-btn" data-item="Pain Reliever">Order</button>
            </div>
            <div class="store-item card">
                <i class="fa-solid fa-prescription-bottle icon-teal"></i>
                <h5>Cough Syrup</h5>
                <span>100 ml • $8.45</span>
                <button class="buy-now-btn" data-item="Cough Syrup">Order</button>
            </div>
            <div class="store-item card">
                <i class="fa-solid fa-box-tissue icon-teal"></i>
                <h5>Allergy Relief</h5>
                <span>30 tablets • $14.20</span>
                <button class="buy-now-btn" data-item="Allergy Relief">Order</button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Generated by shared.js -->
    </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Navigation highlights
    initNavbar('pharmacy');

    const DEFAULT_PILLS = [
        { name: 'Metformin', dose: '1 Tablet (500mg)', time: 'Morning & Night', taken: false },
        { name: 'Atorvastatin', dose: '1 Tablet (20mg)', time: 'At Bedtime', taken: true }
    ];

    const medicinesListContainer = document.getElementById('medicines-list-container');
    const addMedicineForm = document.getElementById('add-medicine-form');
    const toggleAddMedBtn = document.getElementById('toggle-add-med');

    // Retrieve active pills from localStorage
    let activePills = getLocalItem('active_pills', DEFAULT_PILLS);

    function renderMedicines() {
        medicinesListContainer.innerHTML = '';
        
        if (activePills.length === 0) {
            medicinesListContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-prescription-bottle"></i>
                    <p>No medicines scheduled. Click 'Add Pill' to add one.</p>
                </div>
            `;
            return;
        }

        activePills.forEach((med, idx) => {
            const medItem = document.createElement('div');
            medItem.className = `pill-item ${med.taken ? 'taken' : ''}`;
            medItem.innerHTML = `
                <div class="pill-info">
                    <h5>${med.name}</h5>
                    <span>${med.dose} • ${med.time}</span>
                </div>
                <input type="checkbox" class="pill-checkbox" data-index="${idx}" ${med.taken ? 'checked' : ''}>
            `;
            medicinesListContainer.appendChild(medItem);
        });

        // Register check event listeners
        document.querySelectorAll('.pill-checkbox').forEach(chk => {
            chk.addEventListener('change', (e) => {
                const idx = parseInt(chk.getAttribute('data-index'));
                activePills[idx].taken = chk.checked;
                setLocalItem('active_pills', activePills);
                renderMedicines();
            });
        });
    }

    // Toggle add pill form
    toggleAddMedBtn.addEventListener('click', () => {
        if (addMedicineForm.style.display === 'none') {
            addMedicineForm.style.display = 'block';
            toggleAddMedBtn.innerHTML = '<i class="fa-solid fa-minus"></i> Cancel';
        } else {
            addMedicineForm.style.display = 'none';
            toggleAddMedBtn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Pill';
        }
    });

    // Form submission
    addMedicineForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const medName = document.getElementById('new-med-name').value.trim();
        const medDose = document.getElementById('new-med-dose').value.trim();
        const medTime = document.getElementById('new-med-time').value.trim();

        if (medName && medDose && medTime) {
            activePills.push({
                name: medName,
                dose: medDose,
                time: medTime,
                taken: false
            });
            
            setLocalItem('active_pills', activePills);
            renderMedicines();
            
            addMedicineForm.reset();
            addMedicineForm.style.display = 'none';
            toggleAddMedBtn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Pill';
        }
    });

    // Order buttons listeners
    document.querySelectorAll('.buy-now-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const item = btn.getAttribute('data-item');
            alert(`💊 Success!\n\n${item} has been added to your order list.\nEstimated delivery is tomorrow at 2:00 PM.`);
        });
    });

    // Initial render
    renderMedicines();
});
</script>
</body>
</html>
