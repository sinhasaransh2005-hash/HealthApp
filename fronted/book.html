<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - HealthTrack</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="container">

        <!-- Header -->
        <div class="subpage-header">
            <h3><i class="fa-solid fa-calendar-check icon-teal"></i> Book Appointment</h3>
            <a href="interface.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <!-- Specialty Filter Card -->
        <div class="card filter-card">
            <h4>Select Specialty</h4>
            <div class="specialty-pills" id="specialty-container">
                <span class="specialty-pill active" data-specialty="all">All</span>
                <span class="specialty-pill" data-specialty="cardiologist">Cardiology</span>
                <span class="specialty-pill" data-specialty="physician">General Physician</span>
                <span class="specialty-pill" data-specialty="dermatologist">Dermatology</span>
                <span class="specialty-pill" data-specialty="pediatrician">Pediatrics</span>
                <span class="specialty-pill" data-specialty="neurologist">Neurology</span>
            </div>
        </div>

        <!-- Dynamic Doctors List -->
        <div class="doctors-list" id="doctors-list-container">
            <!-- Populated dynamically -->
        </div>

        <!-- Booking Form Card (Hidden by default, slides up when active) -->
        <div class="card booking-form-card" id="booking-form-container" style="display: none;">
            <h4 id="booking-title">Book with Doctor</h4>
            
            <!-- Slot counter indicator box -->
            <div class="slot-status-box" id="slot-status-container" style="display: none;">
                <span>Availability on chosen date:</span>
                <strong id="slot-status-text">12 / 15 slots booked</strong>
            </div>

            <!-- Error banner for slot validation -->
            <div class="error-banner" id="booking-error-banner" style="display: none; margin-bottom: 16px;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="booking-error-message">This doctor is fully booked for this date. Maximum 15 bookings allowed.</span>
            </div>

            <form id="appointment-booking-form">
                <input type="hidden" id="booking-doctor-name">
                
                <div class="form-group">
                    <label for="booking-date"><i class="fa-solid fa-calendar-days"></i> Select Date</label>
                    <input type="date" id="booking-date" required>
                </div>
                
                <div class="form-group">
                    <label for="booking-time"><i class="fa-solid fa-clock"></i> Select Time Slot</label>
                    <select id="booking-time" required>
                        <option value="">-- Choose Slot --</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:30 AM">10:30 AM</option>
                        <option value="11:30 AM">11:30 AM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="03:30 PM">03:30 PM</option>
                        <option value="04:30 PM">04:30 PM</option>
                    </select>
                </div>

                <div class="booking-form-actions">
                    <button type="button" class="cancel-booking-btn" id="cancel-booking">Cancel</button>
                    <button type="submit" class="confirm-booking-btn" id="confirm-booking-btn">Confirm Booking</button>
                </div>
            </form>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Generated by shared.js -->
    </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Navigation highlights
    initNavbar('appointments');

    // DOM references
    const doctorsListContainer = document.getElementById('doctors-list-container');
    const specialtyContainer = document.getElementById('specialty-container');
    const bookingFormContainer = document.getElementById('booking-form-container');
    const bookingTitle = document.getElementById('booking-title');
    const bookingDoctorNameInput = document.getElementById('booking-doctor-name');
    const bookingDateInput = document.getElementById('booking-date');
    const bookingTimeInput = document.getElementById('booking-time');
    const bookingForm = document.getElementById('appointment-booking-form');
    
    const slotStatusContainer = document.getElementById('slot-status-container');
    const slotStatusText = document.getElementById('slot-status-text');
    const bookingErrorBanner = document.getElementById('booking-error-banner');
    const bookingErrorMessage = document.getElementById('booking-error-message');
    const confirmBookingBtn = document.getElementById('confirm-booking-btn');
    const cancelBookingBtn = document.getElementById('cancel-booking');

    // Enforce tomorrow as minimum date for booking
    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const minDateStr = tomorrow.toISOString().split('T')[0];
    bookingDateInput.min = minDateStr;

    // Render doctors list
    function renderDoctors(specialtyFilter = 'all') {
        doctorsListContainer.innerHTML = '';
        const filtered = specialtyFilter === 'all' 
            ? DOCTORS 
            : DOCTORS.filter(d => d.specialtyKey === specialtyFilter);

        filtered.forEach(doc => {
            const card = document.createElement('div');
            card.className = 'doctor-card card';
            card.innerHTML = `
                <div class="doctor-profile">
                    <div class="doctor-avatar"><i class="fa-solid fa-user-doctor"></i></div>
                    <div class="doctor-info">
                        <h4>${doc.name}</h4>
                        <p class="specialty">${doc.specialty}</p>
                        <div class="rating"><i class="fa-solid fa-star"></i> ${doc.rating}</div>
                        <p class="intro-text">${doc.intro}</p>
                    </div>
                </div>
                <div class="doctor-meta">
                    <span>Consultation: <strong>${doc.consultation}</strong></span>
                    <button class="book-now-btn" data-doctor="${doc.name}">Book Now</button>
                </div>
            `;
            doctorsListContainer.appendChild(card);
        });

        // Add event listeners to "Book Now" buttons
        document.querySelectorAll('.book-now-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const docName = btn.getAttribute('data-doctor');
                openBookingForm(docName);
            });
        });
    }

    // Initialize doctor cards
    renderDoctors();

    // Specialty filter toggle listener
    specialtyContainer.addEventListener('click', (e) => {
        const pill = e.target.closest('.specialty-pill');
        if (!pill) return;
        
        document.querySelectorAll('.specialty-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        
        renderDoctors(pill.getAttribute('data-specialty'));
        bookingFormContainer.style.display = 'none'; // hide form if list filters
    });

    // Open booking form drawer
    function openBookingForm(doctorName) {
        bookingDoctorNameInput.value = doctorName;
        bookingTitle.textContent = `Book with ${doctorName}`;
        
        // Clear previous state
        bookingDateInput.value = '';
        bookingTimeInput.value = '';
        slotStatusContainer.style.display = 'none';
        bookingErrorBanner.style.display = 'none';
        confirmBookingBtn.disabled = false;
        
        bookingFormContainer.style.display = 'block';
        bookingFormContainer.scrollIntoView({ behavior: 'smooth' });
    }

    // Cancel booking form
    cancelBookingBtn.addEventListener('click', () => {
        bookingFormContainer.style.display = 'none';
    });

    // Validate slots check in real-time when date is changed
    bookingDateInput.addEventListener('change', () => {
        validateSlots();
    });

    function validateSlots() {
        const docName = bookingDoctorNameInput.value;
        const selectedDate = bookingDateInput.value;
        if (!docName || !selectedDate) return;

        // Query slots booked from shared.js
        const bookedCount = getBookingCount(docName, selectedDate);
        const slotsAvailable = 15 - bookedCount;

        slotStatusContainer.style.display = 'flex';
        
        if (bookedCount >= 15) {
            slotStatusContainer.className = 'slot-status-box full';
            slotStatusText.textContent = `15 / 15 slots booked (0 available)`;
            
            bookingErrorMessage.textContent = 'This doctor is fully booked for this date. Maximum 15 bookings allowed.';
            bookingErrorBanner.style.display = 'flex';
            confirmBookingBtn.disabled = true;
        } else {
            slotStatusContainer.className = 'slot-status-box';
            slotStatusText.textContent = `${bookedCount} / 15 slots booked (${slotsAvailable} available)`;
            
            bookingErrorBanner.style.display = 'none';
            confirmBookingBtn.disabled = false;
        }
    }

    // Form submission
    bookingForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const docName = bookingDoctorNameInput.value;
        const selectedDate = bookingDateInput.value;
        const selectedTime = bookingTimeInput.value;

        if (!selectedDate || !selectedTime) {
            alert('Please select a valid date and time slot.');
            return;
        }

        const payload = {
            doctorName: docName,
            bookingDate: selectedDate,
            timeSlot: selectedTime
        };

        try {
            confirmBookingBtn.disabled = true;
            confirmBookingBtn.textContent = 'Booking...';

            await bookDoctorAppointment(payload);
            
            alert(`Success! Appointment booked with ${docName} for ${selectedDate} at ${selectedTime}.`);
            bookingFormContainer.style.display = 'none';
            
            // Redirect back to dashboard to see updated upcoming appointment details
            window.location.href = 'interface.html';
        } catch(err) {
            console.error(err);
            bookingErrorMessage.textContent = err.message || 'Failed to book appointment. Please try again.';
            bookingErrorBanner.style.display = 'flex';
            confirmBookingBtn.disabled = false;
            confirmBookingBtn.textContent = 'Confirm Booking';
            bookingFormContainer.scrollIntoView({ behavior: 'smooth' });
        }
    });
});
</script>
</body>
</html>
