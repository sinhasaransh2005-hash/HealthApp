<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile - HealthTrack</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="container">

        <!-- Header -->
        <div class="subpage-header">
            <h3><i class="fa-solid fa-circle-user icon-teal"></i> Personal Profile</h3>
            <a href="interface.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <!-- User Profile Card -->
        <div class="card user-profile-card">
            <div class="profile-main">
                <div class="profile-big-avatar" id="profile-avatar"><i class="fa-solid fa-user-astronaut"></i></div>
                <div class="profile-main-info">
                    <h4 id="profile-fullname">John Doe</h4>
                    <p id="profile-role">Patient ID: #HT-98745</p>
                </div>
            </div>
            
            <div class="profile-details-grid">
                <div class="details-item">
                    <span>Username</span>
                    <strong id="profile-username">john_doe</strong>
                </div>
                <div class="details-item">
                    <span>Gender</span>
                    <strong id="profile-gender">Male</strong>
                </div>
                <div class="details-item">
                    <span>Age</span>
                    <strong id="profile-age">30 years</strong>
                </div>
                <div class="details-item">
                    <span>Phone</span>
                    <strong id="profile-phone">+1 555-0199</strong>
                </div>
                <div class="details-item" style="grid-column: span 2;">
                    <span>Gmail Address</span>
                    <strong id="profile-gmail">john.doe@gmail.com</strong>
                </div>
                <div class="details-item" style="grid-column: span 2;">
                    <span>Address</span>
                    <strong id="profile-address">123 Health Ave, Wellness City</strong>
                </div>
            </div>
        </div>

        <!-- Emergency Contact Card -->
        <div class="card emergency-contacts-card">
            <h4>Emergency Contact</h4>
            <div class="contact-item">
                <div class="contact-left">
                    <i class="fa-solid fa-house-chimney-user icon-teal"></i>
                    <div>
                        <h5>Jane Doe</h5>
                        <span>Spouse</span>
                    </div>
                </div>
                <button class="contact-call-btn" id="call-emergency-contact">Call</button>
            </div>
        </div>

        <!-- Logout Action Button -->
        <div style="margin-top: 24px; margin-bottom: 24px; text-align: center;">
            <button class="submit-btn" id="profile-logout-btn" style="background: #ef4444; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; width: 100%;">
                <i class="fa-solid fa-right-from-bracket"></i> Logout from Account
            </button>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Generated by shared.js -->
    </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Navigation highlights
    initNavbar('profile');

    const user = getCurrentUser();
    if (user) {
        document.getElementById('profile-fullname').innerText = user.fullname;
        document.getElementById('profile-role').innerText = user.role === 'doctor' ? 'Clinical Specialist' : `Patient ID: #HT-${Math.floor(10000 + Math.random() * 90000)}`;
        document.getElementById('profile-avatar').innerHTML = user.role === 'doctor' ? '<i class="fa-solid fa-user-md" style="color: #4f46e5;"></i>' : '<i class="fa-solid fa-user-astronaut"></i>';
        
        document.getElementById('profile-username').innerText = user.username;
        document.getElementById('profile-gender').innerText = user.gender;
        document.getElementById('profile-age').innerText = `${user.age} years`;
        document.getElementById('profile-phone').innerText = user.phone;
        document.getElementById('profile-gmail').innerText = user.gmail;
        document.getElementById('profile-address').innerText = user.address;
        
        // Hide emergency contact card for doctor portal
        if (user.role === 'doctor') {
            const emergencyCard = document.querySelector('.emergency-contacts-card');
            if (emergencyCard) emergencyCard.style.display = 'none';
        }
    }

    const callBtn = document.getElementById('call-emergency-contact');
    if (callBtn) {
        callBtn.addEventListener('click', () => {
            alert('📞 Dialing Jane Doe (Spouse)...\n\nSimulating outgoing emergency contact voice call.');
        });
    }

    const logoutBtn = document.getElementById('profile-logout-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            logout();
        });
    }
});
</script>
</body>
</html>
