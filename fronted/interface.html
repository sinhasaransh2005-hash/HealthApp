<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Premium Health Companion</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="container">

        <!-- Header -->
        <header>
            <div class="header-main">
                <div>
                    <h2 id="greeting-title">Good Morning</h2>
                    <p>Stay healthy today</p>
                </div>
                <button class="settings-btn" id="open-settings" title="Update Metrics">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <!-- Search Box -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Search doctors, medicines...">
        </div>

        <!-- Health Score Card -->
        <div class="health-score card">
            <div class="card-header">
                <h3><i class="fa-solid fa-heart-pulse icon-teal"></i> Health Score</h3>
                <span class="pulse-indicator"></span>
            </div>
            <div class="score" id="score-text">--/100</div>
            <div class="progress">
                <div class="progress-fill" id="score-progress" style="width: 0%"></div>
            </div>
        </div>

        <!-- Upcoming Appointment Card -->
        <div class="appointment card">
            <div class="card-header">
                <h3><i class="fa-solid fa-calendar-check icon-teal"></i> Upcoming Appointment</h3>
            </div>
            <p id="appointment-doctor">Loading...</p>
            <span id="appointment-time">Loading...</span>
        </div>

        <!-- Quick Actions -->
        <h3 class="section-title">Quick Actions</h3>
        <div class="actions">
            <a href="book.html" class="action-btn" id="action-book">
                <i class="fa-solid fa-user-doctor"></i> Book
            </a>
            <a href="reports.html" class="action-btn" id="action-reports">
                <i class="fa-solid fa-file-medical"></i> Reports
            </a>
            <a href="medicines.html" class="action-btn" id="action-medicines">
                <i class="fa-solid fa-pills"></i> Medicines
            </a>
            <a href="emergency.html" class="action-btn emergency" id="action-emergency">
                <i class="fa-solid fa-truck-medical"></i> Emergency
            </a>
        </div>

        <!-- Today's Stats -->
        <h3 class="section-title">Today's Stats</h3>
        <div class="stats-grid">
            <div class="stat-card" data-metric="heartRate">
                <div class="stat-icon"><i class="fa-solid fa-heartbeat"></i></div>
                <h4>Heart Rate</h4>
                <p id="stat-heartRate">-- BPM</p>
            </div>

            <div class="stat-card" data-metric="steps">
                <div class="stat-icon"><i class="fa-solid fa-shoe-prints"></i></div>
                <h4>Steps</h4>
                <p id="stat-steps">--</p>
            </div>

            <div class="stat-card" data-metric="water">
                <div class="stat-icon"><i class="fa-solid fa-glass-water"></i></div>
                <h4>Water</h4>
                <p id="stat-water">-- L</p>
            </div>

            <div class="stat-card" data-metric="sleep">
                <div class="stat-icon"><i class="fa-solid fa-moon"></i></div>
                <h4>Sleep</h4>
                <p id="stat-sleep">-- hrs</p>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Generated by shared.js -->
    </nav>
</div>

<!-- Settings Modal -->
<div class="modal" id="metrics-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Update Health Metrics</h3>
            <button class="close-btn" id="close-settings">&times;</button>
        </div>
        <form id="metrics-form">
            <div class="form-group">
                <label for="input-score"><i class="fa-solid fa-heart-pulse"></i> Health Score (1-100)</label>
                <input type="number" id="input-score" min="1" max="100" required>
            </div>
            <div class="form-group">
                <label for="input-heartRate"><i class="fa-solid fa-heartbeat"></i> Heart Rate (BPM)</label>
                <input type="number" id="input-heartRate" min="30" max="220" required>
            </div>
            <div class="form-group">
                <label for="input-steps"><i class="fa-solid fa-shoe-prints"></i> Steps</label>
                <input type="number" id="input-steps" min="0" required>
            </div>
            <div class="form-group">
                <label for="input-water"><i class="fa-solid fa-glass-water"></i> Water (Liters)</label>
                <input type="number" id="input-water" step="0.1" min="0" required>
            </div>
            <div class="form-group">
                <label for="input-sleep"><i class="fa-solid fa-moon"></i> Sleep (Hours)</label>
                <input type="number" id="input-sleep" step="0.1" min="0" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="input-doctor"><i class="fa-solid fa-user-doctor"></i> Appointment Doctor</label>
                    <input type="text" id="input-doctor">
                </div>
                <div class="form-group">
                    <label for="input-time"><i class="fa-solid fa-clock"></i> Appointment Time</label>
                    <input type="text" id="input-time">
                </div>
            </div>
            <button type="submit" class="submit-btn">Save Changes</button>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    // Nav bar setup
    initNavbar('home');

    // DOM selectors
    const scoreText = document.getElementById('score-text');
    const scoreProgress = document.getElementById('score-progress');
    const appointmentDoctor = document.getElementById('appointment-doctor');
    const appointmentTime = document.getElementById('appointment-time');
    const statHeartRate = document.getElementById('stat-heartRate');
    const statSteps = document.getElementById('stat-steps');
    const statWater = document.getElementById('stat-water');
    const statSleep = document.getElementById('stat-sleep');

    // Settings Modal DOM
    const openSettingsBtn = document.getElementById('open-settings');
    const closeSettingsBtn = document.getElementById('close-settings');
    const metricsModal = document.getElementById('metrics-modal');
    const metricsForm = document.getElementById('metrics-form');

    const inputScore = document.getElementById('input-score');
    const inputHeartRate = document.getElementById('input-heartRate');
    const inputSteps = document.getElementById('input-steps');
    const inputWater = document.getElementById('input-water');
    const inputSleep = document.getElementById('input-sleep');
    const inputDoctor = document.getElementById('input-doctor');
    const inputTime = document.getElementById('input-time');

    let cacheData = null;

    // Load data
    async function loadData() {
        cacheData = await getDashboardData();
        
        // Update greeting based on time of day
        const hr = new Date().getHours();
        let greeting = 'Good Morning';
        if (hr >= 12 && hr < 17) greeting = 'Good Afternoon';
        else if (hr >= 17) greeting = 'Good Evening';
        document.getElementById('greeting-title').innerText = greeting;

        // Populate fields
        scoreText.textContent = `${cacheData.healthScore}/100`;
        scoreProgress.style.width = `${cacheData.healthScore}%`;

        appointmentDoctor.textContent = cacheData.appointmentDoctor || 'No upcoming appointments';
        appointmentTime.textContent = cacheData.appointmentTime || 'Schedule one anytime';

        statHeartRate.textContent = `${cacheData.heartRate} BPM`;
        statSteps.textContent = Number(cacheData.steps).toLocaleString();
        statWater.textContent = `${cacheData.water.toFixed(1)} L`;
        statSleep.textContent = `${cacheData.sleep.toFixed(1)} hrs`;
    }

    await loadData();

    // Modal listeners
    openSettingsBtn.addEventListener('click', () => {
        if (cacheData) {
            inputScore.value = cacheData.healthScore;
            inputHeartRate.value = cacheData.heartRate;
            inputSteps.value = cacheData.steps;
            inputWater.value = cacheData.water;
            inputSleep.value = cacheData.sleep;
            inputDoctor.value = cacheData.appointmentDoctor || '';
            inputTime.value = cacheData.appointmentTime || '';
        }
        metricsModal.classList.add('active');
    });

    closeSettingsBtn.addEventListener('click', () => {
        metricsModal.classList.remove('active');
    });

    window.addEventListener('click', (e) => {
        if (e.target === metricsModal) {
            metricsModal.classList.remove('active');
        }
    });

    metricsForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const updated = {
            healthScore: parseInt(inputScore.value) || 0,
            heartRate: parseInt(inputHeartRate.value) || 0,
            steps: parseInt(inputSteps.value) || 0,
            water: parseFloat(inputWater.value) || 0.0,
            sleep: parseFloat(inputSleep.value) || 0.0,
            appointmentDoctor: inputDoctor.value.trim(),
            appointmentTime: inputTime.value.trim()
        };

        const result = await saveDashboardData(updated);
        metricsModal.classList.remove('active');
        await loadData();
    });
});
</script>
</body>
</html>
