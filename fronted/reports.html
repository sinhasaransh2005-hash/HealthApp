<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Reports - HealthTrack</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="container">

        <!-- Header -->
        <div class="subpage-header">
            <h3><i class="fa-solid fa-file-medical icon-teal"></i> Medical Reports</h3>
            <a href="interface.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <!-- File Upload Card -->
        <div class="reports-container card">
            <div class="upload-zone" id="upload-zone">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                <p class="upload-title">Upload Health Report Image</p>
                <p class="upload-subtitle">Drag & drop or click to browse</p>
                <div id="upload-progress-container" class="upload-progress-container" style="display: none;">
                    <div class="spinner"></div>
                    <span id="upload-status-text">Uploading...</span>
                </div>
            </div>

            <!-- Error Banner -->
            <div class="error-banner" id="error-banner" style="display: none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-message">Error message</span>
            </div>

            <!-- Recent Reports Header -->
            <div class="reports-list-header">
                <h4>Recent Reports</h4>
            </div>

            <!-- Recent Reports list grid -->
            <div class="reports-list" id="reports-list">
                <div class="empty-state">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>No reports uploaded yet.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Generated by shared.js -->
    </nav>
</div>

<!-- Image Lightbox Modal -->
<div class="modal" id="image-modal">
    <div class="modal-content image-modal-content">
        <div class="modal-header">
            <h3 id="image-modal-title">View Report</h3>
            <button class="close-btn" id="close-image-modal">&times;</button>
        </div>
        <div class="image-container">
            <img id="lightbox-image" src="" alt="Report Image">
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Navigation highlights
    initNavbar('home'); // Associated with home sub-actions

    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    const reportsList = document.getElementById('reports-list');
    const errorBanner = document.getElementById('error-banner');
    const errorMessage = document.getElementById('error-message');
    const uploadProgressContainer = document.getElementById('upload-progress-container');
    const uploadStatusText = document.getElementById('upload-status-text');

    const imageModal = document.getElementById('image-modal');
    const lightboxImage = document.getElementById('lightbox-image');
    const imageModalTitle = document.getElementById('image-modal-title');
    const closeImageModalBtn = document.getElementById('close-image-modal');

    // Fetch reports
    async function loadReports() {
        try {
            const reports = await getReportsList();
            renderReports(reports);
        } catch(err) {
            console.error(err);
            reportsList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-circle-xmark" style="color: var(--danger);"></i>
                    <p>Error loading reports list.</p>
                </div>
            `;
        }
    }

    // Render list items
    function renderReports(reports) {
        if (!reports || reports.length === 0) {
            reportsList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>No reports uploaded yet.</p>
                </div>
            `;
            return;
        }

        reportsList.innerHTML = '';
        reports.forEach(report => {
            const reportItem = document.createElement('div');
            reportItem.className = 'report-item';
            
            // Handle filename display (extract UUID if exist)
            let displayName = report.filename;
            if (displayName.includes('_')) {
                displayName = displayName.substring(displayName.indexOf('_') + 1);
            }

            // If local url, it might be large base64 data.
            // If backend url, it will be /api/reports/view/...
            const finalUrl = report.url.startsWith('data:') ? report.url : (API_BASE + report.url);

            reportItem.innerHTML = `
                <div class="report-info">
                    <i class="fa-solid fa-file-image report-file-icon"></i>
                    <div class="report-details">
                        <h5 title="${displayName}">${displayName}</h5>
                        <span>${report.uploadDate}<span class="bullet">•</span>${report.size}</span>
                    </div>
                </div>
                <button class="view-report-btn" data-url="${finalUrl}" data-title="${displayName}">
                    <i class="fa-regular fa-eye"></i> View
                </button>
            `;
            reportsList.appendChild(reportItem);
        });

        // Click viewer event
        document.querySelectorAll('.view-report-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const url = btn.getAttribute('data-url');
                const title = btn.getAttribute('data-title');
                openLightbox(url, title);
            });
        });
    }

    // Modal view actions
    function openLightbox(url, title) {
        lightboxImage.src = url;
        imageModalTitle.textContent = title;
        imageModal.classList.add('active');
    }

    closeImageModalBtn.addEventListener('click', () => {
        imageModal.classList.remove('active');
    });

    window.addEventListener('click', (e) => {
        if (e.target === imageModal) {
            imageModal.classList.remove('active');
        }
    });

    // Upload triggers
    uploadZone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            handleUpload(fileInput.files[0]);
        }
    });

    // Drag-and-drop listeners
    ['dragenter', 'dragover'].forEach(name => {
        uploadZone.addEventListener(name, (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadZone.classList.add('dragover');
        });
    });

    ['dragleave', 'drop'].forEach(name => {
        uploadZone.addEventListener(name, (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadZone.classList.remove('dragover');
        });
    });

    uploadZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files.length > 0) {
            handleUpload(dt.files[0]);
        }
    });

    async function handleUpload(file) {
        hideError();

        // Enforce images only
        if (!file.type.startsWith('image/')) {
            showError('Only image report files (JPEG, PNG, GIF, WebP) are supported.');
            fileInput.value = '';
            return;
        }

        // Show uploading progress state
        uploadProgressContainer.style.display = 'flex';
        uploadStatusText.textContent = 'Uploading...';
        uploadZone.style.pointerEvents = 'none';

        try {
            await uploadReportFile(file);
            fileInput.value = '';
            await loadReports();
        } catch(err) {
            console.error(err);
            showError(err.message || 'Failed to upload report image.');
        } finally {
            uploadProgressContainer.style.display = 'none';
            uploadZone.style.pointerEvents = 'auto';
        }
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorBanner.style.display = 'flex';
        setTimeout(hideError, 6000);
    }

    function hideError() {
        errorBanner.style.display = 'none';
    }

    // Initial load
    loadReports();
});
</script>
</body>
</html>
